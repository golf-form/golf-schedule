<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLUS VALUE Golf Club｜ゴルフ日程調整フォーム</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",Meiryo,sans-serif;
  background:#004d32;color:#123f30;
}
.hero{width:100%;line-height:0;overflow:hidden;background:#004d32}
.hero img{display:block;width:100%;height:auto}
.container{
  width:calc(100% - 50px);max-width:765px;margin:0 auto 40px;
  background:#fff;border-radius:28px;box-shadow:0 8px 28px rgba(0,0,0,.16);
  overflow:hidden;
}
.form-inner{padding:30px 38px 34px}
h1{
  margin:0 0 28px;font-size:clamp(27px,5vw,42px);
  line-height:1.25;font-weight:800;color:#063f2d;
}
label,.field-title{
  display:block;margin:0 0 9px;font-size:20px;font-weight:800;color:#123e30;
}
.field{margin-bottom:21px}
input[type=text],input[type=date]{
  width:100%;height:60px;padding:0 18px;border:2px solid #d7d7d7;
  border-radius:10px;background:#fff;font-size:17px;color:#333;
}
.choice-group{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.choice{
  display:flex;align-items:center;min-height:68px;padding:10px 16px;
  border:2px solid #d7d7d7;border-radius:11px;background:#fff;
  cursor:pointer;font-size:18px;font-weight:700;color:#222;
}
.choice input{
  appearance:none;-webkit-appearance:none;width:30px;height:30px;
  margin:0 13px 0 0;border:2px solid #c8c8c8;border-radius:50%;
  flex:0 0 30px;background:#fff;
}
.choice input:checked{border:9px solid #0b5a3e}
.date-row{display:flex;gap:8px;margin-bottom:9px}
.date-row input{flex:1;min-width:0}
.remove-date{
  width:76px;border:1px solid #ddd;border-radius:10px;background:#f7f7f7;
  color:#555;font-size:15px;cursor:pointer;
}
#addDate{
  width:auto;min-height:45px;padding:7px 17px;margin-top:2px;
  border:1px solid #bbb;border-radius:23px;background:#fff;font-size:15px;
  cursor:pointer;
}
#submitButton{
  width:100%;height:64px;margin-top:5px;border:0;border-radius:10px;
  background:#004d32;color:#fff;font-size:21px;font-weight:800;
  cursor:pointer;
}
#submitButton:disabled{opacity:.6}
#message{margin:15px 0 0;text-align:center;font-weight:700;min-height:1.4em;color:#0b5a3e}
.note{margin:14px 0 0;text-align:center;color:#666;font-size:13px}
@media(max-width:430px){
  .container{width:calc(100% - 28px);border-radius:24px}
  .form-inner{padding:24px 24px 27px}
  h1{font-size:27px}
  label,.field-title{font-size:18px}
  .choice-group{gap:10px}
  .choice{padding:9px 10px;font-size:15px}
  .choice input{width:27px;height:27px;flex-basis:27px;margin-right:8px}
}
</style>
</head>

<main class="container">
<div class="form-inner">
<h1>ゴルフ日程調整フォーム</h1>

<form id="golfForm">

<div class="field">
<label for="name">名前</label>
<input type="text" id="name" placeholder="例：田中 太郎" required>
</div>

<div class="field">
<div class="field-title">参加可否</div>
<div class="choice-group">
<label class="choice"><input type="radio" name="attendance_choice" value="参加" required><span>参加する</span></label>
<label class="choice"><input type="radio" name="attendance_choice" value="不参加"><span>参加しない</span></label>
</div>
</div>

<div class="field">
<div class="field-title">車を出せますか？</div>
<div class="choice-group">
<label class="choice"><input type="radio" name="car_choice" value="はい" required><span>はい</span></label>
<label class="choice"><input type="radio" name="car_choice" value="いいえ"><span>いいえ</span></label>
</div>
</div>

<div class="field">
<div class="field-title">参加可能日</div>
<div id="dateContainer">
<div class="date-row"><input type="date" class="available-date"></div>
</div>
<button type="button" id="addDate">＋ 参加可能日を追加</button>
</div>

<div class="field">
<label for="golf_course">次回行きたいゴルフ場</label>
<input type="text" id="golf_course" placeholder="ゴルフ場を入力してください">
</div>

<button type="submit" id="submitButton">回答を送信する</button>
</form>

<p class="note">※ 回答はいつでも編集・削除できます</p>
<p id="message"></p>
</div>
</main>

<script>
const SUPABASE_URL="https://ewhqgxyscbpjxhrtvwum.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_yVWVActp5jUP2NJyEmFdpw_BiCxW5dl";

document.getElementById("addDate").addEventListener("click",function(){
 const c=document.getElementById("dateContainer");
 const row=document.createElement("div");
 row.className="date-row";
 row.innerHTML='<input type="date" class="available-date"><button type="button" class="remove-date">削除</button>';
 c.appendChild(row);
});

document.getElementById("dateContainer").addEventListener("click",function(e){
 if(e.target.classList.contains("remove-date")) e.target.parentElement.remove();
});

document.getElementById("golfForm").addEventListener("submit",async function(e){
 e.preventDefault();
 const message=document.getElementById("message");
 const submit=document.getElementById("submitButton");
 const name=document.getElementById("name").value;
 const attendance=document.querySelector('input[name="attendance_choice"]:checked')?.value||"";
 const carAvailable=document.querySelector('input[name="car_choice"]:checked')?.value||"";
 const golfCourse=document.getElementById("golf_course").value;
 const dates=[...document.querySelectorAll(".available-date")].map(x=>x.value).filter(Boolean);

 if(dates.length===0){message.textContent="参加可能日を1つ以上入力してください。";return}

 submit.disabled=true;message.textContent="送信中...";

 try{
  const response=await fetch(`${SUPABASE_URL}/rest/v1/golf_responses`,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
    "Prefer":"return=representation"
   },
   body:JSON.stringify({
    name,attendance:attendance||null,car_available:carAvailable||null,
    available_date:dates[0]||null,golf_course:golfCourse||null
   })
  });
  if(!response.ok){console.error(await response.text());message.textContent="回答の送信に失敗しました。";submit.disabled=false;return}
  const data=await response.json();
  const dateResponse=await fetch(`${SUPABASE_URL}/rest/v1/golf_available_dates`,{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "apikey":SUPABASE_ANON_KEY,
    "Authorization":`Bearer ${SUPABASE_ANON_KEY}`,
    "Prefer":"return=minimal"
   },
   body:JSON.stringify(dates.map(date=>({response_id:data[0].id,available_date:date})))
  });
  if(!dateResponse.ok){console.error(await dateResponse.text());message.textContent="回答は登録されましたが、参加可能日の登録に失敗しました。";submit.disabled=false;return}
  message.textContent="回答を送信しました！";
  document.getElementById("golfForm").reset();
  document.getElementById("dateContainer").innerHTML='<div class="date-row"><input type="date" class="available-date"></div>';
 }catch(err){
  console.error(err);message.textContent="通信エラーが発生しました。";
 }
 submit.disabled=false;
});
</script>
</body>
</html>
